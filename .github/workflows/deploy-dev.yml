name: Deploy Dev

on:
  push:
    branches:
      - dev

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm --filter backend run build

      - name: Build frontend
        run: pnpm --filter frontend run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy dev
        working-directory: infra
        run: npx cdk deploy --all --context stage=dev --require-approval never --outputs-file outputs.json

      - name: Read API URL
        working-directory: infra
        run: |
          node -e "const fs = require('fs'); const outputs = JSON.parse(fs.readFileSync('outputs.json', 'utf8')); const apiUrl = outputs['cookinglab-dev-api']?.ApiUrl; if (!apiUrl) throw new Error('ApiUrl output not found for cookinglab-dev-api'); fs.appendFileSync(process.env.GITHUB_ENV, `API_URL=${apiUrl}\n`);"

      - name: Smoke test healthz
        run: |
          status=$(curl --silent --output /tmp/healthz.json --write-out "%{http_code}" "${API_URL%/}/healthz")
          cat /tmp/healthz.json
          test "$status" = "200"
