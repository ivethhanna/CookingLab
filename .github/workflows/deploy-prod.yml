name: Deploy Prod

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm --filter backend run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy prod infrastructure
        working-directory: infra
        run: npx cdk deploy cookinglab-prod-data cookinglab-prod-auth cookinglab-prod-events cookinglab-prod-api cookinglab-prod-observability cookinglab-prod-cicd --context stage=prod --require-approval never --outputs-file outputs.json

      - name: Extract frontend env vars
        working-directory: infra
        env:
          STAGE: prod
        run: node scripts/write-frontend-env.js

      - name: Build frontend
        run: pnpm --filter frontend run build

      - name: Deploy prod frontend
        working-directory: infra
        run: npx cdk deploy cookinglab-prod-front --context stage=prod --require-approval never --outputs-file outputs-front.json

      - name: Extract API URL from outputs
        working-directory: infra
        env:
          API_STACK_NAME: cookinglab-prod-api
        run: node scripts/write-api-url.js

      - name: Smoke test healthz
        run: |
          status=$(curl --silent --output /tmp/healthz.json --write-out "%{http_code}" "${API_URL%/}/healthz")
          cat /tmp/healthz.json
          test "$status" = "200"
